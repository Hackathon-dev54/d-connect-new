<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>D-Connect | Web Crawler Ping & Hybrid Webhook Messenger</title>
    <meta name="description" content="Decentralized messenger powered by database storage, Web Crawler Ping sender, and hybrid webhook federation with mini discovery tags." />
    
    <!-- Web Crawler Ping & Hybrid Webhook Discovery Tags -->
    <meta name="crawler-protocol" content="crawler-ping/2.1" />
    <meta name="crawler-ping-endpoint" content="/api/crawler/ping" />
    <meta name="crawler-webhook-endpoint" content="/api/crawler/webhook" />
    <meta name="crawler-discovery-tags" content="#dconnect, #crawler-ping, #hybrid-webhook, #federated-db" />
    <link rel="crawler-manifest" href="/api/crawler/manifest" />

    <!-- PWA Settings -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="D-Connect" />
    
    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Google Identity Services (Sign in with Google) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Open Graph -->
    <meta property="og:title" content="D-Connect | Web Crawler Ping & Hybrid Webhook Messenger" />
    <meta property="og:description" content="Decentralized messenger powered by database storage, Web Crawler Ping sender, and hybrid webhook federation with mini discovery tags." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body class="overflow-hidden select-none bg-slate-950 text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
